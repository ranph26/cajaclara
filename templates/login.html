<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - CajaClara</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CajaClara">
    <meta name="theme-color" content="#09090b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-yellow': '#FFDE21',
              'brand-black': '#09090b',
              'brand-dark': '#18181b',
              'brand-gray': '#27272a',
              'brand-light': '#e4e4e7'
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #e4e4e7; }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-brand-black p-4">

    <div class="bg-brand-dark border border-brand-gray rounded-xl p-8 shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-wider text-brand-yellow">CAJA<span class="text-white">CLARA</span></h1>
            <p class="text-sm text-zinc-500 mt-2 font-medium">Portal de Consultoría Financiera</p>
        </div>

        {% if error %}
        <div class="bg-rose-900/30 border border-rose-500 text-rose-400 p-3 rounded-lg text-sm text-center mb-6 font-bold">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Pin de Acceso</label>
                <input type="password" name="password" placeholder="••••••" class="w-full bg-brand-black border border-brand-gray text-white rounded-lg px-4 py-3 text-center text-2xl tracking-widest focus:outline-none focus:border-brand-yellow" required autofocus>
            </div>
            
            <button type="submit" class="w-full bg-brand-yellow hover:bg-[#e6c81e] text-brand-black font-bold py-3.5 rounded-lg transition-all shadow-[0_0_15px_rgba(255,222,33,0.15)]">
                ENTRAR AL SISTEMA
            </button>
        </form>
    </div>

</body>
</html>
